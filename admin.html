<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QonexAI™ - Blockchain Ledger Audit Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 1.5rem; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.875rem; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .result-box { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; display: none; word-break: break-all; }
        pre { white-space: pre-wrap; margin: 0; font-size: 0.85rem; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️ QonexAI™ Ledger Audit</h2>
        <p style="font-size: 0.85rem; text-align: center; color: #94a3b8; margin-bottom: 20px;">Verify math metrics and Wema Bank routing pipelines instantly.</p>
        
        <div class="input-group">
            <label for="searchQuery">Enter Block Index or Cryptographic Hash</label>
            <input type="text" id="searchQuery" placeholder="e.g., 5 or a1b2c3d4...">
        </div>
        
        <button onclick="lookupTransaction()">Query Blockchain Ledger</button>

        <div id="resultBox" class="result-box">
            <h4 style="margin: 0 0 10px 0; color: #34d399;">✅ Data Verified & Match Found</h4>
            <pre id="jsonDisplay"></pre>
        </div>
    </div>

    <script>
        async function lookupTransaction() {
            const query = document.getElementById('searchQuery').value.trim();
            const resultBox = document.getElementById('resultBox');
            const jsonDisplay = document.getElementById('jsonDisplay');

            if (!query) return alert('Please enter a block index or hash identifier.');

            try {
                // Connects dynamically to your isolated backend engine api layer
                const response = await fetch(`http://localhost:5000/api/v1/ledger/search?query=${query}`);
                
                if (!response.ok) {
                    throw new Error('Block record not found or ledger linkage broken.');
                }

                const blockData = await response.json();
                
                jsonDisplay.textContent = JSON.stringify(blockData, null, 2);
                resultBox.style.display = 'block';
            } catch (err) {
                alert(err.message);
                resultBox.style.display = 'none';
            }
        }
    </script>
</body>
</html>
