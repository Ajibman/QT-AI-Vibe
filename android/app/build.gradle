// Read signing properties from root directory
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '3.12.0' // Automates Google Play
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.qtai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // This handles alternative stores (Amazon/Huawei) by creating flavor variations
    flavorDimensions "storefront"
    productFlavors {
        googlePlay {
            dimension "storefront"
        }
        amazonStore {
            dimension "storefront"
            applicationIdSuffix ".amazon"
        }
        huaweiGallery {
            dimension "storefront"
            applicationIdSuffix ".huawei"
        }
    }
}

// Connects your automated publisher directly to the Google Play flavor
play {
    serviceAccountCredentials = file(System.getenv("PLAY_STORE_JSON_KEY_PATH") ?: "play-key.json")
    track = 'production'
}

// overwrite just the release signing parameters with pipeline-ready configurations.
android.signingConfigs {
    release {
        storeFile file(System.getenv("MYAPP_RELEASE_STORE_FILE") ?: "release.keystore")
        storePassword System.getenv("MYAPP_RELEASE_STORE_PASSWORD") ?: project.findProperty("MYAPP_RELEASE_STORE_PASSWORD")
        keyAlias System.getenv("MYAPP_RELEASE_KEY_ALIAS") ?: project.findProperty("MYAPP_RELEASE_KEY_ALIAS") ?: "release-key"
        keyPassword System.getenv("MYAPP_RELEASE_KEY_PASSWORD") ?: project.findProperty("MYAPP_RELEASE_KEY_PASSWORD")
    }
}

android.buildTypes.release {
    minifyEnabled true
    shrinkResources true
    signingConfig android.signingConfigs.release
}

