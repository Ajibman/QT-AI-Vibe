name: Publish to Google Play (production-android)
on:
  workflow_dispatch:

jobs:
  release:
    name: Publish production Android
    runs-on: ubuntu-latest
    environment: production-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write Play service account JSON
        run: echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > $GITHUB_WORKSPACE/google-play.json

      - name: Publish to Play
        run: ./gradlew publishBundle -PplayAccountJson=$GITHUB_WORKSPACE/google-play.json
