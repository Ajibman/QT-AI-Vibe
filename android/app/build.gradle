// Read signing properties from root directory
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '3.12.0' // Automates Google Play
}

android {
    compileSdk 34

        signingConfigs {
        release {
            if (signingProps.containsKey('STORE_FILE')) {
                storeFile = rootProject.file(signingProps['STORE_FILE'])
                storePassword = signingProps['STORE_PASSWORD']
                keyAlias = signingProps['KEY_ALIAS']
                keyPassword = signingProps['KEY_PASSWORD']
            }
        }
    }
        
    defaultConfig {
        applicationId "com.qtai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // This handles alternative stores (Amazon/Huawei) by creating flavor variations
    flavorDimensions "storefront"
    productFlavors {
        googlePlay {
            dimension "storefront"
        }
        amazonStore {
            dimension "storefront"
            applicationIdSuffix ".amazon"
        }
        huaweiGallery {
            dimension "storefront"
            applicationIdSuffix ".huawei"
        }
    }
}

// Connects your automated publisher directly to the Google Play flavor
play {
    serviceAccountCredentials = file(System.getenv("PLAY_STORE_JSON_KEY_PATH") ?: "play-key.json")
    track = 'production'
}

// Read signing properties from root directory
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '3.12.0' 
}

android {
    compileSdk 34

    signingConfigs {
        release {
            // Priority 1: CI/CD Environment Variables
            if (System.getenv("MYAPP_RELEASE_STORE_FILE") != null) {
                storeFile = file(System.getenv("MYAPP_RELEASE_STORE_FILE"))
                storePassword = System.getenv("MYAPP_RELEASE_STORE_PASSWORD")
                keyAlias = System.getenv("MYAPP_RELEASE_KEY_ALIAS") ?: "release-key"
                keyPassword = System.getenv("MYAPP_RELEASE_KEY_PASSWORD")
            } 
            // Priority 2: Local signing.properties file
            else if (signingProps.containsKey('STORE_FILE')) {
                storeFile = rootProject.file(signingProps['STORE_FILE'])
                storePassword = signingProps['STORE_PASSWORD']
                keyAlias = signingProps['KEY_ALIAS']
                keyPassword = signingProps['KEY_PASSWORD']
            } 
            // Priority 3: Safe, non-crashing local compilation fallback
            else {
                storeFile = file('../debug.keystore')
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }
        
    defaultConfig {
        applicationId "com.qtai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions "storefront"
    productFlavors {
        googlePlay { dimension "storefront" }
        amazonStore {
            dimension "storefront"
            applicationIdSuffix ".amazon"
        }
        huaweiGallery {
            dimension "storefront"
            applicationIdSuffix ".huawei"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }
}

play {
    serviceAccountCredentials = file(System.getenv("PLAY_STORE_JSON_KEY_PATH") ?: "play-key.json")
    track = 'production'
}

android.buildTypes.release {
    minifyEnabled true
    shrinkResources true
    signingConfig android.signingConfigs.release
}

