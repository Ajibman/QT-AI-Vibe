name: Google Play Store Production Deploy

on:
  push:
    branches:
      - main # Triggers compilation only when code hits your main stable branch

jobs:
  deploy-to-play-store:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone the latest codebase into the runner
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Step 2: Establish correct Java environment required by Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Decode your private Android release Keystore from GitHub Secrets
      - name: Decode Android Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      # Step 4: Run the Gradle production build to output a signed .aab bundle
      - name: Build Signed Android App Bundle (AAB)
        run: ./gradlew bundleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Step 5: Deliver the finished build directly into your Google Play Console
      - name: Upload to Google Play Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.qtai.app # Replace with your exact Android ApplicationID
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal # Safest path: push to internal track first for team testing
          
